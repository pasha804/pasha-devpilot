[project]
name = "devpilot-demo-service"
version = "0.1.0"
description = "Controlled testbed repository for Pasha DevPilot autonomous verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
